<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="lang.js"></script>
<title>Входящие — Хат.Почта</title>
<style>
  :root{
    --blue:#00AFCA; --blue-dark:#0089a0; --blue-deep:#06566a;
    --gold:#FEC50C; --gold-dark:#d9a400;
    --bg:#f2f6f8; --card:#fff; --text:#1d2a30; --muted:#6b7c85; --line:#e3eaee;
    --hover:#f3fafc; --sel:#e3f6fa; --red:#d63b3b; --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  /* ===== ШАПКА ===== */
  header{background:linear-gradient(90deg,var(--blue-deep),var(--blue));color:#fff;flex:none}
  .top{display:flex;align-items:center;gap:20px;height:64px;padding:0 20px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:28px;color:var(--gold);width:222px;flex:none}
  .logo small{display:block;font-size:11px;font-weight:600;color:#e6f7fb;margin-top:-4px}
  .logo-mark{width:44px;height:44px;flex:none}
  .logo-mark .rays{transform-origin:50px 50px;animation:spin 40s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .msearch{flex:1;max-width:620px;display:flex;align-items:center;background:rgba(255,255,255,.95);border-radius:10px;padding:0 12px}
  .msearch span{opacity:.5}
  .msearch input{flex:1;border:none;outline:none;background:none;padding:11px 10px;font-size:14px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .lang{display:flex;gap:4px;font-size:13px}
  .lang a{opacity:.75;padding:2px 4px}
  .lang a.on{opacity:1;font-weight:700;border-bottom:2px solid var(--gold)}
  .top-right .ico-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px}
  .top-right .ico-btn:hover{background:rgba(255,255,255,.25)}
  .user{position:relative}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--blue-deep);font-weight:800;display:grid;place-items:center;cursor:pointer;border:2px solid rgba(255,255,255,.6)}
  .menu{position:absolute;right:0;top:46px;background:#fff;color:var(--text);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);width:250px;padding:8px;display:none;z-index:20}
  .menu.on{display:block}
  .menu .who{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .menu .who b{display:block}
  .menu .who small{color:var(--muted)}
  .menu a{display:block;padding:9px 12px;border-radius:8px}
  .menu a:hover{background:var(--hover)}

  /* ===== ОСНОВА ===== */
  .app{flex:1;display:grid;grid-template-columns:240px 1fr;min-height:0}

  /* Боковая панель */
  aside{padding:16px 12px;overflow-y:auto}
  .compose-btn{width:100%;border:none;background:var(--gold);color:var(--blue-deep);font-weight:800;font-size:15px;padding:13px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 10px rgba(254,197,12,.35)}
  .compose-btn:hover{background:var(--gold-dark)}
  .folders{list-style:none;margin-top:16px}
  .folders li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:14px;margin-bottom:2px}
  .folders li:hover{background:#e8f3f6}
  .folders li.on{background:var(--sel);color:var(--blue-deep);font-weight:700}
  .folders .fi{width:20px;text-align:center}
  .folders .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--blue-dark)}
  .folders .cnt.muted{color:var(--muted);font-weight:500}
  .side-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 12px 6px}
  .storage{margin:20px 12px 0;font-size:12px;color:var(--muted)}
  .storage .bar{height:6px;background:var(--line);border-radius:3px;margin:6px 0;overflow:hidden}
  .storage .bar i{display:block;height:100%;width:3%;background:var(--blue)}
  .side-ad{margin:20px 4px 0;height:250px;border:2px dashed #c3d2d8;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#8a9ba3;text-align:center;
    background:repeating-linear-gradient(45deg,#eef3f5,#eef3f5 10px,#e6edf0 10px,#e6edf0 20px)}
  .side-ad b{color:#6f838c}

  /* Центральная часть */
  .main{background:var(--card);margin:12px 12px 12px 0;border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .toolbar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none;min-height:56px}
  .toolbar h2{font-size:18px;margin-right:auto}
  .tb{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .tb:hover{border-color:var(--blue);background:var(--hover)}
  .tb:disabled{opacity:.45;cursor:default;border-color:var(--line);background:#fff}
  .chk{width:17px;height:17px;accent-color:var(--blue);cursor:pointer;flex:none}

  /* Список писем */
  .list{overflow-y:auto;flex:1}
  .ad-strip{margin:10px 14px;height:70px;border:2px dashed #c3d2d8;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#8a9ba3;
    background:repeating-linear-gradient(45deg,#eef3f5,#eef3f5 10px,#e6edf0 10px,#e6edf0 20px)}
  .msg{display:grid;grid-template-columns:20px 22px 36px 190px 1fr auto;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .msg:hover{background:var(--hover)}
  .msg.selected{background:var(--sel)}
  .msg .star{border:none;background:none;cursor:pointer;font-size:16px;color:#c8d3d8;padding:0}
  .msg .star.on{color:var(--gold-dark)}
  .ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
  .msg .from{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msg .subj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
  .msg .subj b{color:var(--text);font-weight:500}
  .msg .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
  .msg.unread .from,.msg.unread .subj b{font-weight:800}
  .msg.unread .meta{color:var(--blue-dark);font-weight:700}
  .msg.unread{box-shadow:inset 3px 0 0 var(--blue)}
  .empty{text-align:center;color:var(--muted);padding:80px 20px}
  .empty div{font-size:48px;margin-bottom:10px}

  /* Чтение письма */
  .read{display:none;flex-direction:column;flex:1;min-height:0}
  .read.on{display:flex}
  .read-body{overflow-y:auto;padding:24px 32px;flex:1}
  .read h1{font-size:22px;margin-bottom:18px}
  .read .hdr{display:flex;gap:12px;align-items:center;margin-bottom:22px}
  .read .hdr .ava{width:44px;height:44px;font-size:17px}
  .read .hdr small{display:block;color:var(--muted)}
  .read .hdr .date{margin-left:auto;color:var(--muted);font-size:13px}
  .read .text{font-size:15px;line-height:1.65;max-width:760px;white-space:pre-line}
  .files{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
  .file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:200px}
  .file .ext{width:36px;height:42px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800}
  .file small{display:block;color:var(--muted);font-size:12px}
  .reply-bar{display:flex;gap:8px;padding:14px 32px;border-top:1px solid var(--line)}

  /* Документы */
  .docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:16px}
  .docs .file{flex-direction:column;align-items:flex-start;cursor:pointer;min-width:0}
  .docs .file:hover{border-color:var(--blue);background:var(--hover)}
  .docs .file .ext{width:44px;height:52px;font-size:12px}
  .docs .file b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

  /* Окно нового письма */
  .compose{position:fixed;right:24px;bottom:0;width:560px;max-width:calc(100vw - 24px);background:#fff;border-radius:14px 14px 0 0;box-shadow:0 10px 40px rgba(0,0,0,.25);display:none;flex-direction:column;z-index:30;height:520px;max-height:85vh}
  .compose.on{display:flex}
  .compose .ch{background:var(--blue-deep);color:#fff;padding:12px 16px;border-radius:14px 14px 0 0;display:flex;align-items:center;font-weight:700}
  .compose .ch button{margin-left:auto;background:none;border:none;color:#fff;font-size:18px;cursor:pointer;opacity:.8}
  .compose .ch button:hover{opacity:1}
  .cf{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 16px}
  .cf label{color:var(--muted);width:50px;font-size:13px}
  .cf input{flex:1;border:none;outline:none;padding:12px 0;font-size:14px}
  .compose textarea{flex:1;border:none;outline:none;resize:none;padding:14px 16px;font-family:inherit;font-size:14px;line-height:1.55}
  .compose .attached{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px}
  .compose .attached span{background:var(--hover);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px}
  .compose .cfoot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  .send{border:none;background:var(--blue);color:#fff;font-weight:700;padding:10px 22px;border-radius:9px;cursor:pointer;font-size:14px}
  .send:hover{background:var(--blue-dark)}
  .cerr{color:var(--red);font-size:12px;margin-left:6px}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1d2a30;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:40;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%)}

  @media(max-width:900px){
    .app{grid-template-columns:1fr}
    aside{display:none}
    .main{margin:8px}
    .msg{grid-template-columns:20px 36px 1fr auto}
    .msg .star{display:none}
    .msg .from{grid-column:3}
    .msg .subj{grid-column:2/-1;grid-row:2}
    .logo{width:auto}
    .logo div{display:none}
    .mobile-compose{display:flex!important}
  }
  .mobile-compose{display:none;position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;background:var(--gold);border:none;font-size:22px;box-shadow:0 6px 16px rgba(0,0,0,.2);cursor:pointer;align-items:center;justify-content:center;z-index:25}
</style>
</head>
<body>

<header>
  <div class="top">
    <a href="index.html" class="logo"><svg class="logo-mark" viewBox="0 0 100 100"></svg><div>Хат<small>Почта</small></div></a>
    <label class="msearch"><span>🔍</span><input id="search" placeholder="Поиск по письмам"></label>
    <div class="top-right">
      <div class="lang"><a href="#">ҚАЗ</a><a href="#">РУС</a></div>
      <button class="ico-btn" title="Главная" onclick="location.href='index.html'">🏠</button>
      <button class="ico-btn" title="Настройки" onclick="toast('Настройки появятся позже')">⚙️</button>
      <div class="user">
        <div class="avatar" id="avatar">Ж</div>
        <div class="menu" id="menu">
          <div class="who"><b id="userName">Жаркын</b><small id="userMail">zharkyn@kazxat.kz</small></div>
          <a href="#" onclick="toast('Настройки появятся позже');return false">⚙️ Настройки</a>
          <a href="#" onclick="toast('Смена пароля появится позже');return false">🔑 Сменить пароль</a>
          <a href="index.html">🏠 На главную Хат</a>
          <a href="auth.html#login">🚪 Выйти</a>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="app">
  <aside>
    <button class="compose-btn" onclick="openCompose()">✏️ Написать письмо</button>
    <ul class="folders" id="folders"></ul>
    <div class="storage">Занято 0,3 ГБ<div class="bar"><i></i></div></div>
    <!-- Рекламное место в почте -->
    <div class="side-ad"><b>Рекламное место</b>Баннер 240×250</div>
  </aside>

  <section class="main">
    <!-- Панель над списком -->
    <div class="toolbar" id="listBar">
      <input type="checkbox" class="chk" id="checkAll" title="Выбрать все">
      <h2 id="folderTitle">Входящие</h2>
      <button class="tb" id="bRead" disabled>✉️ Прочитано</button>
      <button class="tb" id="bSpam" disabled>🚫 Спам</button>
      <button class="tb" id="bDel" disabled>🗑️ Удалить</button>
    </div>
    <!-- Панель над открытым письмом -->
    <div class="toolbar" id="readBar" style="display:none">
      <button class="tb" onclick="closeRead()">← Назад</button>
      <span style="margin-right:auto"></span>
      <button class="tb" id="rReply">↩️ Ответить</button>
      <button class="tb" id="rFwd">↪️ Переслать</button>
      <button class="tb" id="rSpam">🚫 Спам</button>
      <button class="tb" id="rDel">🗑️ Удалить</button>
    </div>

    <div class="list" id="list"></div>

    <div class="read" id="read">
      <div class="read-body" id="readBody"></div>
      <div class="reply-bar">
        <button class="tb" onclick="document.getElementById('rReply').click()">↩️ Ответить</button>
        <button class="tb" onclick="document.getElementById('rFwd').click()">↪️ Переслать</button>
      </div>
    </div>
  </section>
</div>

<button class="mobile-compose" onclick="openCompose()" title="Написать">✏️</button>

<!-- Новое письмо -->
<div class="compose" id="compose">
  <div class="ch"><span id="cTitle">Новое письмо</span><button onclick="closeCompose(true)" title="Закрыть">✕</button></div>
  <div class="cf"><label>Кому</label><input id="cTo" placeholder="адрес@kazxat.kz"></div>
  <div class="cf"><label>Тема</label><input id="cSubj"></div>
  <textarea id="cText" placeholder="Текст письма"></textarea>
  <div class="attached" id="cFiles"></div>
  <div class="cfoot">
    <button class="send" onclick="sendMail()">Отправить</button>
    <label class="tb" style="cursor:pointer">📎 Прикрепить<input type="file" multiple hidden id="cAttach"></label>
    <span class="cerr" id="cErr"></span>
    <button class="tb" style="margin-left:auto" onclick="closeCompose(false)" title="Удалить черновик">🗑️</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ===== ДЕМО-ДАННЫЕ =====
     Сейчас письма выдуманные, чтобы посмотреть оформление.
     На сервере этот список будет приходить из почтового сервера mailcow. */
  const ME = {name:"Жаркын", mail:"zharkyn@kazxat.kz"};
  const FOLDERS = [
    {id:"inbox",  name:"Входящие",     ico:"📥"},
    {id:"sent",   name:"Отправленные", ico:"📤"},
    {id:"drafts", name:"Черновики",    ico:"📝"},
    {id:"starred",name:"Избранное",    ico:"⭐"},
    {id:"docs",   name:"Документы",    ico:"📎"},
    {id:"spam",   name:"Спам",         ico:"🚫"},
    {id:"trash",  name:"Корзина",      ico:"🗑️"},
  ];
  const COLORS=["#00AFCA","#e67e22","#8e44ad","#16a085","#c0392b","#2c7be5","#d4a017","#27ae60"];
  const today=new Date();
  const ago=(d,h=10,m=0)=>{const x=new Date(today);x.setDate(x.getDate()-d);x.setHours(h,m);return x;};
  let MAILS = [
    {id:1, folder:"inbox", from:"Команда Хат", addr:"hello@kazxat.kz", subj:"Добро пожаловать в Хат.Почту!", date:ago(0,9,12), unread:true, star:true,
     text:"Сәлеметсіз бе!\n\nСпасибо, что выбрали казахстанскую электронную почту Хат. Ваш адрес уже работает: можно писать и получать письма.\n\nЧто стоит сделать в первую очередь:\n• привязать номер телефона, чтобы восстановить доступ, если забудете пароль;\n• настроить подпись в письмах;\n• установить почту на телефон.\n\nС уважением,\nкоманда Хат"},
    {id:2, folder:"inbox", from:"Айгерим Нурланова", addr:"aigerim.n@kazxat.kz", subj:"Документы по проекту", date:ago(0,8,40), unread:true,
     text:"Жаркын, привет!\n\nОтправляю договор и смету, о которых говорили. Посмотри, пожалуйста, до пятницы.\n\nСпасибо!", files:[{name:"Договор.docx",size:"84 КБ"},{name:"Смета.xlsx",size:"32 КБ"}]},
    {id:3, folder:"inbox", from:"PS.kz", addr:"noreply@ps.kz", subj:"Счёт за облачный сервер", date:ago(1,15,5),
     text:"Здравствуйте!\n\nНапоминаем об оплате облачного сервера. Счёт во вложении.", files:[{name:"Счёт.pdf",size:"120 КБ"}]},
    {id:4, folder:"inbox", from:"Ерлан Сапаров", addr:"erlan.saparov@kazxat.kz", subj:"Встреча в субботу", date:ago(2,19,30), unread:true,
     text:"Салам! В субботу в 15:00 всё в силе? Напиши, если что-то поменяется."},
    {id:5, folder:"inbox", from:"Данияр Касымов", addr:"daniyar.k@kazxat.kz", subj:"Фото с поездки", date:ago(4,11,0),
     text:"Как обещал, скидываю фотографии.", files:[{name:"Шымкент_1.jpg",size:"2,4 МБ"},{name:"Шымкент_2.jpg",size:"2,1 МБ"}]},
    {id:6, folder:"inbox", from:"Команда Хат", addr:"hello@kazxat.kz", subj:"Как установить почту на телефон", date:ago(6,10,0),
     text:"Почту Хат можно подключить в любое почтовое приложение на телефоне. Инструкция появится в разделе «Помощь»."},
    {id:7, folder:"sent", from:"Айгерим Нурланова", addr:"aigerim.n@kazxat.kz", subj:"Re: Документы по проекту", date:ago(0,9,50),
     text:"Получил, спасибо! Посмотрю до пятницы."},
    {id:8, folder:"sent", from:"Ерлан Сапаров", addr:"erlan.saparov@kazxat.kz", subj:"Re: Встреча в субботу", date:ago(2,20,10),
     text:"Да, всё в силе. До встречи!"},
    {id:9, folder:"drafts", from:"", addr:"", subj:"План на неделю", date:ago(1,22,15), text:"1. Сайт\n2. Почтовый сервер\n3. "},
    {id:10, folder:"spam", from:"Супер Выигрыш", addr:"win@prize-lottery.example", subj:"Вы выиграли 1 000 000 ₸!!!", date:ago(1,3,14),
     text:"Это пример спам-письма. Такие письма почтовый сервер отправляет в «Спам» автоматически."},
  ];
  let nextId=100;

  /* ===== ЛОГОТИП ===== */
  document.querySelectorAll(".logo-mark").forEach(svg=>{
    let rays=""; for(let i=0;i<32;i++) rays+=`<polygon points="48.2,13 51.8,13 50,2" transform="rotate(${i*360/32} 50 50)"/>`;
    svg.innerHTML=`<g class="rays" fill="#FEC50C">${rays}</g><circle cx="50" cy="50" r="34" fill="none" stroke="#FEC50C" stroke-width="2" opacity=".5"/>
      <text x="50" y="53" text-anchor="middle" dominant-baseline="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="62" fill="#FEC50C">@</text>`;
  });

  /* ===== ПОЛЕЗНОЕ ===== */
  const T = window.HAT_T || (s=>s);
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const color=s=>COLORS[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
  const initial=s=>(s||"?").trim()[0].toUpperCase();
  function fmtDate(d,full){
    const sameDay=d.toDateString()===today.toDateString();
    const y=new Date(today); y.setDate(y.getDate()-1);
    const t=d.toLocaleTimeString((window.HAT_LOCALE||"ru-RU"),{hour:"2-digit",minute:"2-digit"});
    if(full) return d.toLocaleDateString((window.HAT_LOCALE||"ru-RU"),{day:"numeric",month:"long",year:"numeric"})+", "+t;
    if(sameDay) return t;
    if(d.toDateString()===y.toDateString()) return "вчера";
    return d.toLocaleDateString((window.HAT_LOCALE||"ru-RU"),{day:"numeric",month:"short"});
  }
  function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),2200); }
  const EXT={pdf:"#d63b3b",docx:"#2c7be5",doc:"#2c7be5",xlsx:"#1e9e55",xls:"#1e9e55",jpg:"#8e44ad",png:"#8e44ad",zip:"#7f8c8d"};
  const fileHtml=f=>{const e=f.name.split(".").pop().toLowerCase();
    return `<div class="file"><div class="ext" style="background:${EXT[e]||"#6b7c85"}">${e.toUpperCase()}</div><div><b>${esc(f.name)}</b><small>${f.size}</small></div></div>`;};

  /* ===== ПАПКИ ===== */
  let current="inbox", selected=new Set(), openId=null;
  function inFolder(f){
    if(f==="starred") return MAILS.filter(m=>m.star && m.folder!=="trash" && m.folder!=="spam");
    if(f==="docs") return MAILS.filter(m=>m.files && m.files.length && m.folder!=="trash" && m.folder!=="spam");
    return MAILS.filter(m=>m.folder===f);
  }
  function renderFolders(){
    $("folders").innerHTML = FOLDERS.map((f,i)=>{
      const list=inFolder(f.id);
      let cnt="";
      if(f.id==="inbox"){ const u=list.filter(m=>m.unread).length; if(u) cnt=`<span class="cnt">${u}</span>`; }
      else if(f.id==="drafts"||f.id==="spam"){ if(list.length) cnt=`<span class="cnt muted">${list.length}</span>`; }
      const sep = i===4 ? '<div class="side-title">Ещё</div>' : "";
      return `${sep}<li class="${f.id===current?"on":""}" data-f="${f.id}"><span class="fi">${f.ico}</span>${f.name}${cnt}</li>`;
    }).join("");
    const u=inFolder("inbox").filter(m=>m.unread).length;
    document.title=(u?`(${u}) `:"")+FOLDERS.find(f=>f.id===current).name+" — Хат.Почта";
  }
  $("folders").addEventListener("click",e=>{
    const li=e.target.closest("li"); if(!li) return;
    current=li.dataset.f; selected.clear(); $("search").value=""; closeRead(); render();
  });

  /* ===== СПИСОК ПИСЕМ ===== */
  function renderList(){
    const q=$("search").value.trim().toLowerCase();
    let list=inFolder(current);
    if(q) list=MAILS.filter(m=>m.folder!=="trash" && (m.from+m.addr+m.subj+m.text).toLowerCase().includes(q));
    list.sort((a,b)=>b.date-a.date);
    $("folderTitle").textContent = q ? `Поиск: «${q}»` : FOLDERS.find(f=>f.id===current).name;

    if(current==="docs" && !q){
      const files=[]; list.forEach(m=>m.files.forEach(f=>files.push({...f,m})));
      $("list").innerHTML = files.length ? `<div class="docs">${files.map(f=>
        fileHtml(f).replace('<div class="file">',`<div class="file" data-open="${f.m.id}">`).replace("</small></div></div>",
        `</small><small>от ${esc(f.m.from)} · ${fmtDate(f.m.date)}</small></div></div>`)).join("")}</div>` : emptyHtml();
      updateBar(); return;
    }
    let html = current==="inbox"&&!q ? `<div class="ad-strip"><b>Рекламное место</b> баннер в списке писем</div>` : "";
    html += list.map(m=>{
      const who = m.folder==="sent"||m.folder==="drafts" ? (m.from?"Кому: "+m.from:"(без адресата)") : m.from;
      return `<div class="msg ${m.unread?"unread":""} ${selected.has(m.id)?"selected":""}" data-id="${m.id}">
        <input type="checkbox" class="chk" ${selected.has(m.id)?"checked":""}>
        <button class="star ${m.star?"on":""}" title="В избранное">★</button>
        <div class="ava" style="background:${color(who)}">${initial(m.from||"Ч")}</div>
        <div class="from">${m.folder==="sent"||m.folder==="drafts" ? (m.from ? T("Кому")+": <span data-noi18n>"+esc(m.from)+"</span>" : T("(без адресата)")) : "<span data-noi18n>"+esc(m.from)+"</span>"}</div>
        <div class="subj"><b data-noi18n>${esc(m.subj||T("(без темы)"))}</b> — <span data-noi18n>${esc(m.text.replace(/\n/g," ").slice(0,120))}</span></div>
        <div class="meta">${m.files&&m.files.length?"📎":""}${m.folder==="drafts"?'<span style="color:var(--red)">Черновик</span>':""}${fmtDate(m.date)}</div>
      </div>`;
    }).join("");
    $("list").innerHTML = list.length ? html : emptyHtml();
    updateBar();
  }
  function emptyHtml(){
    const t={inbox:["📭","Писем пока нет"],sent:["📤","Вы ещё ничего не отправляли"],drafts:["📝","Черновиков нет"],starred:["⭐","Отмечайте важные письма звёздочкой"],
      docs:["📎","Здесь будут все файлы из ваших писем"],spam:["✅","Спама нет"],trash:["🗑️","Корзина пуста"]}[current]||["🔍","Ничего не найдено"];
    if($("search").value.trim()) return `<div class="empty"><div>🔍</div>Ничего не найдено</div>`;
    return `<div class="empty"><div>${t[0]}</div>${t[1]}</div>`;
  }
  $("list").addEventListener("click",e=>{
    const doc=e.target.closest("[data-open]"); if(doc){ openMail(+doc.dataset.open); return; }
    const row=e.target.closest(".msg"); if(!row) return;
    const id=+row.dataset.id, m=MAILS.find(x=>x.id===id);
    if(e.target.classList.contains("chk")){ e.target.checked?selected.add(id):selected.delete(id); renderList(); return; }
    if(e.target.classList.contains("star")){ m.star=!m.star; render(); return; }
    if(m.folder==="drafts"){ openCompose(m); return; }
    openMail(id);
  });
  $("search").addEventListener("input",()=>{ closeRead(); renderList(); });

  // Действия с выбранными
  function updateBar(){
    const n=selected.size;
    ["bRead","bSpam","bDel"].forEach(b=>$(b).disabled=!n);
    const vis=[...document.querySelectorAll(".msg")].length;
    $("checkAll").checked = n>0 && n===vis;
    $("checkAll").style.visibility = current==="docs"?"hidden":"visible";
  }
  $("checkAll").onchange=e=>{
    selected.clear();
    if(e.target.checked) document.querySelectorAll(".msg").forEach(r=>selected.add(+r.dataset.id));
    renderList();
  };
  function moveTo(ids,folder){
    ids.forEach(id=>{const m=MAILS.find(x=>x.id===id); if(!m) return;
      if(m.folder==="trash" && folder==="trash") MAILS=MAILS.filter(x=>x.id!==id); else m.folder=folder;});
  }
  $("bRead").onclick=()=>{ selected.forEach(id=>MAILS.find(m=>m.id===id).unread=false); selected.clear(); render(); };
  $("bSpam").onclick=()=>{ const n=selected.size; moveTo([...selected],"spam"); selected.clear(); render(); toast(`Перемещено в «Спам»: ${n}`); };
  $("bDel").onclick=()=>{ const n=selected.size, perm=current==="trash"; moveTo([...selected],"trash"); selected.clear(); render(); toast(perm?`Удалено навсегда: ${n}`:`Перемещено в корзину: ${n}`); };

  /* ===== ЧТЕНИЕ ПИСЬМА ===== */
  function openMail(id){
    const m=MAILS.find(x=>x.id===id); if(!m) return;
    openId=id; m.unread=false;
    const out=m.folder==="sent";
    $("readBody").innerHTML=`
      <h1 data-noi18n>${esc(m.subj||T("(без темы)"))}</h1>
      <div class="hdr">
        <div class="ava" style="background:${color(out?ME.name:m.from)}">${initial(out?ME.name:m.from)}</div>
        <div><b>${esc(out?ME.name:m.from)}</b><small>${esc(out?ME.mail:m.addr)} → ${esc(out?m.addr:ME.mail)}</small></div>
        <div class="date">${fmtDate(m.date,true)}</div>
      </div>
      <div class="text" data-noi18n>${esc(m.text)}</div>
      ${m.files&&m.files.length?`<div class="files">${m.files.map(fileHtml).join("")}</div>`:""}`;
    $("list").style.display="none"; $("read").classList.add("on");
    $("listBar").style.display="none"; $("readBar").style.display="flex";
    renderFolders();
  }
  function closeRead(){
    openId=null; $("read").classList.remove("on"); $("list").style.display="";
    $("listBar").style.display="flex"; $("readBar").style.display="none";
  }
  $("rDel").onclick=()=>{ moveTo([openId],"trash"); closeRead(); render(); toast("Письмо перемещено в корзину"); };
  $("rSpam").onclick=()=>{ moveTo([openId],"spam"); closeRead(); render(); toast("Письмо перемещено в «Спам»"); };
  $("rReply").onclick=()=>{ const m=MAILS.find(x=>x.id===openId);
    openCompose({from:m.from,addr:m.addr,subj:"Re: "+m.subj.replace(/^Re: /,""),text:`\n\n\n${fmtDate(m.date,true)}, ${m.from} написал(а):\n> `+m.text.replace(/\n/g,"\n> ")}); };
  $("rFwd").onclick=()=>{ const m=MAILS.find(x=>x.id===openId);
    openCompose({from:"",addr:"",subj:"Fwd: "+m.subj,text:`\n\n-------- Пересланное письмо --------\nОт: ${m.from} <${m.addr}>\nТема: ${m.subj}\n\n`+m.text,files:m.files}); };

  /* ===== НОВОЕ ПИСЬМО ===== */
  let draftId=null, cFiles=[];
  function openCompose(m){
    draftId = m && m.id ? m.id : null;
    $("cTitle").textContent = m && m.subj && m.subj.startsWith("Re:") ? "Ответ" : m && m.subj && m.subj.startsWith("Fwd:") ? "Пересылка" : draftId ? "Черновик" : "Новое письмо";
    $("cTo").value = m ? (m.addr||"") : "";
    $("cSubj").value = m ? (m.subj||"") : "";
    $("cText").value = m ? (m.text||"") : "";
    cFiles = m && m.files ? [...m.files] : [];
    showFiles(); $("cErr").textContent="";
    $("compose").classList.add("on");
    setTimeout(()=>($("cTo").value?$("cText"):$("cTo")).focus(),50);
    if(m && $("cText").value.startsWith("\n")) $("cText").setSelectionRange(0,0);
  }
  function showFiles(){ $("cFiles").innerHTML=cFiles.map(f=>`<span>📎 ${esc(f.name)} · ${f.size}</span>`).join(""); }
  $("cAttach").onchange=e=>{
    [...e.target.files].forEach(f=>cFiles.push({name:f.name,size:f.size>1048576?(f.size/1048576).toFixed(1).replace(".",",")+" МБ":Math.max(1,Math.round(f.size/1024))+" КБ"}));
    showFiles(); e.target.value="";
  };
  function closeCompose(save){
    const to=$("cTo").value.trim(), subj=$("cSubj").value.trim(), text=$("cText").value;
    if(save && (to||subj||text.trim())){
      const d={id:draftId||nextId++,folder:"drafts",from:to,addr:to,subj,text,date:new Date(),files:cFiles};
      MAILS=MAILS.filter(x=>x.id!==d.id); MAILS.push(d); toast("Сохранено в черновиках");
    }else if(!save && draftId){ MAILS=MAILS.filter(x=>x.id!==draftId); toast("Черновик удалён"); }
    $("compose").classList.remove("on"); render();
  }
  function sendMail(){
    const to=$("cTo").value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)){ $("cErr").textContent="Укажите правильный адрес получателя"; return; }
    if(draftId) MAILS=MAILS.filter(x=>x.id!==draftId);
    MAILS.push({id:nextId++,folder:"sent",from:to,addr:to,subj:$("cSubj").value.trim(),text:$("cText").value,date:new Date(),files:cFiles});
    $("compose").classList.remove("on"); render();
    toast("Демо: письмо добавлено в «Отправленные». Настоящая отправка заработает на сервере");
  }

  /* ===== МЕНЮ ПОЛЬЗОВАТЕЛЯ ===== */
  $("avatar").onclick=e=>{ e.stopPropagation(); $("menu").classList.toggle("on"); };
  document.addEventListener("click",()=>$("menu").classList.remove("on"));
  // Адрес пользователя после входа (передаётся со страницы входа)
  try{ const u=sessionStorage.getItem("hatUser"); if(u){ ME.mail=u; ME.name=u.split("@")[0]; } }catch(e){}
  $("userMail").textContent=ME.mail; $("userName").textContent=ME.name; $("avatar").textContent=initial(ME.name);

  function render(){ renderFolders(); if(!openId) renderList(); }
  render();
</script>
</body>
</html>
